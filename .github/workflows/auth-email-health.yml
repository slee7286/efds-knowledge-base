name: Authentication email health
on:
  schedule:
    - cron: '43 4,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-email-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check authentication and account-change emails, delivery events and retention
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_auth_email_health.py
