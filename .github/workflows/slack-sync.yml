name: Slack archive refresh
on:
  schedule:
    - cron: '17 3,15 * * *'
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even when every enabled channel is fresh'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: slack-archive-refresh
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install database driver for freshness check
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check whether a refresh is due
        id: freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python scripts/slack_refresh_due.py
      - name: Install backend
        if: steps.freshness.outputs.refresh == 'true'
        run: python -m pip install .
      - name: Refresh enabled Slack channels and linked meeting documents
        if: steps.freshness.outputs.refresh == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL repository secret'; exit 1; }
          test -n "$SLACK_BOT_TOKEN" || { echo 'Missing SLACK_BOT_TOKEN repository secret'; exit 1; }
          for attempt in 1 2 3; do
            if python scripts/sync_slack.py --all-enabled; then
              echo 'Slack archive and linked meeting documents refreshed successfully.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo 'Refresh failed after three attempts. Review the run and channel checkpoints.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Import newly archived action tickets into the committee register
        if: steps.freshness.outputs.refresh == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/import_slack_tickets.py --apply
      - name: Repost up to five unfinished X-marked tickets after the fresh sync
        if: steps.freshness.outputs.refresh == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repost_open_tickets.py --limit 5
          echo 'Unfinished ticket reminders checked after the successful archive refresh.' >> "$GITHUB_STEP_SUMMARY"
